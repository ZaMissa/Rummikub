      <button class="btn btn--icon btn--fullscreen" id="fullscreenBtn" data-i18n-aria="device.enterFullscreen" data-i18n-title="device.enterFullscreen" aria-label="Enter full screen" title="Enter full screen" aria-pressed="false"></button>
      <button class="btn btn--icon btn--menu" id="menuBtn" data-action="menu" data-i18n-aria="header.gameMenu" aria-label="Game menu"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-menu"/></svg></button>

        <div class="turnline">
          <strong class="turn-title" id="turn-title" data-i18n="hud.readyToPlay">Ready to play</strong>

          <p class="hint statusline" id="status"></p>
        </div>
        <button class="btn btn--icon btn--replay" id="btn-replay" hidden data-i18n-aria="recap.watch" data-i18n-title="recap.watch" aria-label="Replay the moves" title="Replay the moves"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-history"/></svg></button>

      <div class="melds" id="melds"></div>
    </section>

    <section class="rackpanel" id="rackpanel">
      <!-- The in-game Hand & table drawer (v0.41.70): compact controls that slide out ABOVE the
           strip and leave the hand + felt visible, so a sort/hide/tile-size tap shows its effect
           immediately. Opened by the tools button; the rows are the same options the sheet renders. -->
      <div class="drawer" id="hand-drawer" data-i18n-aria="hand.title" aria-label="Hand &amp; table">
        <div class="drawer-head">
          <b data-i18n="hand.title">Hand &amp; table</b>
          <button class="btn btn--icon" id="btn-drawer-close" data-i18n-aria="common.close" aria-label="Close"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-close"/></svg></button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
      <!-- Collapse lives on the panel's border, not inside the control strip (v0.41.68). -->
      <button class="btn btn--glyph rack-handle" id="btn-collapse" data-i18n-aria="device.rackCollapse" data-i18n-title="device.rackToggleTitle" aria-label="Collapse the rack" aria-expanded="true" title="Collapse or show the rack"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-chevronDown"/></svg></button>
      <!-- One control strip: [Undo] [contextual primary] + [Arrange] [more]. Placement (above or
           below the hand) is a setting; the default is above. Arrange does not add a second row —
           the same strip swaps contents to [Undo move] [Sort] [Done], so the play actions are absent
           while arranging (UIU-27, decisions #17–#18). See syncActionBar(). -->
      <div class="controlstrip">
        <div class="actions actions--game" id="game-actions">
          <button class="btn btn--undo" id="btn-undo" data-i18n-aria="game.undoLast" data-i18n-title="game.undoLast" aria-label="Undo last move" title="Undo last move"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-undo"/></svg></button>
          <button class="btn btn--meld" id="btn-meld"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-plus"/></svg> <span class="lbl" data-i18n="board.meld">Meld</span></button>
          <button class="btn btn--draw" id="btn-draw" data-i18n="game.draw">Draw</button>
          <button class="btn btn--primary btn--play" id="btn-play" data-i18n="game.endTurn">End turn</button>
          <button class="btn btn--undo-move" id="btn-undo-move" data-i18n-aria="game.undoMove" data-i18n-title="game.undoMove" aria-label="Undo move" title="Undo move" hidden><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-undo"/></svg> <span class="lbl" data-i18n="game.undoMove">Undo move</span></button>
          <button class="btn" id="btn-sort" data-i18n="game.sort" hidden>Sort</button>
          <button class="btn btn--primary btn--done" id="btn-done-arrange" hidden><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-check"/></svg> <span class="lbl" data-i18n="common.done">Done</span></button>
        </div>
        <!-- A finished round has no in-game action left, so this swaps in for #game-actions
             (see syncRoundActions) and gives the table its two ways forward. -->
        <div class="actions actions--round" id="round-actions" hidden>
          <button class="btn btn--primary" id="btn-next-round" data-i18n="game.nextRound">Next round</button>
          <button class="btn" id="btn-new-game" data-i18n="common.newGame">New game</button>
        </div>
        <div class="toolbar">
          <!-- UIU-21: the table stone size, one tap to cycle Small/Medium/Large, persisted per
               device. The letter is the current step; the tooltip/aria name the size in full. -->
          <button class="btn btn--chip btn--zoom" id="btn-zoom" data-i18n-title="table.size" aria-label="Stone size" title="Stone size">M</button>
          <!-- UIU-20: shown when Single cannot hold the hand at the 26 px floor — one tap switches -->
          <button class="btn btn--chip" id="btn-rack-mode" hidden data-i18n="game.rackModeMulti" data-i18n-title="game.rackModeTitle" title="Show the hand in more lines">Multi</button>
          <button class="btn btn--icon btn--arrange" id="btn-arrange" data-i18n-aria="game.arrangeLabel" data-i18n-title="game.arrangeTitle" aria-label="Arrange your rack" title="Arrange your rack" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13m-4-4 4 4-4 4M20 15H7m4-4-4 4 4 4"/></svg></button>
          <button class="btn btn--icon btn--hand-tools" id="btn-hand-tools" data-i18n-aria="game.handTools" data-i18n-title="game.handToolsTitle" aria-label="Hand &amp; table tools" title="Sort and hand options"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><use href="#ico-more"/></svg></button>
        </div>
      </div>
      <p class="rack-hint" id="rack-hint" data-i18n="rackHint.arrange">Tap a stone, then tap a gap to drop it there.</p>
      <div class="rack" id="rack"></div>
    </section>
  </div>

      <button class="btn btn--primary" id="curtain-btn" data-action="dismiss-curtain" data-i18n="curtain.ready">I'm ready · Show my stones</button>
    </div>
  </div>
