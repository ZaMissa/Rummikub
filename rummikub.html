      <div class="row row--between">

          <b id="rack-title">Your hand</b>
          <span class="pill" id="sel-count" aria-live="polite"></span>
        </div>
        <div class="toolbar">
          <button class="btn btn--arrange" id="btn-arrange" title="Arrange your rack" aria-pressed="false">⇄ Arrange</button>
          <button class="btn btn--icon" id="btn-hand-tools" aria-label="Hand &amp; table tools" title="Sort and hand options">•••</button>
          <button class="btn btn--icon btn--glyph" id="btn-collapse" aria-label="Collapse the rack" aria-expanded="true" title="Collapse or show the rack">⌄</button>
        </div>
      </div>
      <p id="rack-hint">Pick a tile. Tap the left half of another tile for before, or its right half for after.</p>
      <div id="arrange-options" class="row" hidden>

        <button class="btn" id="btn-clear-gaps">Clear gaps</button>

      <div class="rack" id="rack"></div>
      <p class="hint" id="status"></p>
      <div class="actions actions--game" id="game-actions">
        <button class="btn btn--undo" id="btn-undo" title="Undo last move">↶</button>
        <button class="btn btn--meld" id="btn-meld">＋ Meld</button>
        <button class="btn btn--draw" id="btn-draw">Draw</button>
        <button class="btn btn--primary btn--play" id="btn-play">End turn</button>
      </div>
      <div class="actions actions--arrange" id="arrange-actions" hidden>
        <button class="btn btn--undo-move" id="btn-undo-move">↶ Undo move</button>
        <button class="btn" id="btn-cancel-pick">Cancel pick</button>
        <button class="btn btn--primary btn--done" id="btn-done-arrange">✓ Done</button>
      </div>
    </section>
  </div>

  <div class="ov" id="ov-dialog" hidden>
    <div class="card" id="dialog-card"></div>
  </div>
