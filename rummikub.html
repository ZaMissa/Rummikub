  <meta name="app-version" content="0.41.14">

<body>
  <header class="topbar">
    <div class="brand">
      <h1>Rummikub</h1>
    </div>
    <span id="mode-line">On this phone</span>
    <div class="row">
      <button id="awayBadge" hidden title="What happened while you were away">Updates</button>
      <button id="btn-nudge" hidden title="Nudge the current player">Nudge</button>
      <button id="menuBtn" data-action="menu" aria-label="Game menu">☰</button>
    </div>
  </header>

  <div class="banner net" id="net-banner" role="status" aria-live="polite" hidden></div>

  <div class="wrap">
    <div class="players" id="players" aria-label="Players"></div>

    <div class="status">
      <div class="row between">
        <div class="turnline">
          <strong id="turn-title">Ready to play</strong>
          <small id="turn-sub"></small>
        </div>
        <span id="pool">106 in pool</span>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <section class="board" id="board">
      <div class="melds" id="melds"></div>
    </section>

    <section class="rackpanel" id="rackpanel">
      <div class="row between">
        <div class="rackwho">
          <b id="rack-title">Your hand</b>
          <span class="pill" id="sel-count" aria-live="polite"></span>
        </div>
        <div class="toolbar">
          <button id="btn-arrange" title="Arrange your rack" aria-pressed="false">⇄ Arrange</button>
          <button id="btn-hand-tools" aria-label="Hand &amp; table tools" title="Sort and hand options">•••</button>
          <button id="btn-collapse" aria-label="Collapse the rack" aria-expanded="true" title="Collapse or show the rack">⌄</button>
        </div>
      </div>
      <p id="rack-hint">Pick a tile. Tap the left half of another tile for before, or its right half for after.</p>
      <div id="arrange-options" class="row" hidden>
        <button id="btn-group-gap">Gap before picked tile</button>
        <button id="btn-clear-gaps">Clear gaps</button>
        <button id="btn-to-end">To end →</button>
      </div>
      <div class="rack" id="rack"></div>
      <p class="hint" id="status"></p>
      <div class="actions" id="game-actions">
        <button id="btn-undo" title="Undo last move">↶</button>
        <button id="btn-meld">＋ Meld</button>
        <button id="btn-draw">Draw</button>
        <button class="primary" id="btn-play">End turn</button>
      </div>
      <div class="actions" id="arrange-actions" hidden>
        <button id="btn-undo-move">↶ Undo move</button>
        <button id="btn-cancel-pick">Cancel pick</button>
        <button class="primary" id="btn-done-arrange">✓ Done</button>
      </div>
    </section>
  </div>

  <div class="ov" id="ov-dialog" hidden>
    <div class="card" id="dialog-card"></div>
  </div>

  <!-- Pass & play handover (privacy curtain) -->
  <div class="ov" id="ov-curtain" hidden>
    <div class="curtaininner">
      <div class="eyebrow">A little privacy</div>
      <h2 id="curtain-title">Pass the phone</h2>
      <p id="curtain-sub">Hand over the phone. The next rack is hidden until its owner is ready.</p>
      <button class="primary" data-action="dismiss-curtain">I'm ready · Show my tiles</button>
    </div>
  </div>
