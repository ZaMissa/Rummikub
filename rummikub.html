  <meta name="app-version" content="0.41.60">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Rummikub</h1>
    </div>
    <span id="mode-line">On this phone</span>
    <div class="row row--nowrap">
      <button class="btn btn--icon" id="awayBadge" hidden title="What happened while you were away">Updates</button>
      <button class="btn btn--icon btn--nudge" id="btn-nudge" hidden title="Nudge the current player">Nudge</button>
      <button class="btn btn--icon btn--menu" id="menuBtn" data-action="menu" aria-label="Game menu">☰</button>
    </div>
  </header>

  <div class="banner net" id="net-banner" role="status" aria-live="polite" hidden></div>

  <div class="wrap">
    <div class="players" id="players" aria-label="Players"></div>

    <div class="status">
      <div class="row row--between row--nowrap">
        <div class="turnline">
          <strong id="turn-title">Ready to play</strong>
          <small id="turn-sub"></small>
          <p class="hint statusline" id="status"></p>
        </div>
        <span id="pool">106 in pool</span>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <section class="board" id="board">
      <div class="melds" id="melds"></div>
    </section>

    <section class="rackpanel" id="rackpanel">
      <!-- [UIU-19] One control strip above the hand. The action bar used to sit *below* the
           hand, so the felt paid for two rows of controls; they now share this one. -->
      <div class="rackstrip">
        <span class="rackstate">
          <span class="pill" id="sel-count" aria-live="polite"></span>
          <!-- UIU-20: shown when Single cannot hold the hand at the 26 px floor — one tap switches -->
          <button class="btn btn--chip" id="btn-rack-mode" hidden title="Show the hand in more lines">Multi</button>
        </span>
        <b class="rackwho" id="rack-title">Your hand</b>
        <div class="actions actions--game" id="game-actions">
          <button class="btn btn--undo" id="btn-undo" aria-label="Undo last move" title="Undo last move">↶</button>
          <button class="btn btn--meld" id="btn-meld"><span class="ico" aria-hidden="true">＋</span> <span class="lbl">Meld</span></button>
          <button class="btn btn--draw" id="btn-draw">Draw</button>
          <button class="btn btn--primary btn--play" id="btn-play">End turn</button>
        </div>
        <div class="actions actions--arrange" id="arrange-actions" hidden>
          <button class="btn btn--undo-move" id="btn-undo-move"><span class="ico" aria-hidden="true">↶</span> <span class="lbl">Undo move</span></button>
          <button class="btn" id="btn-cancel-pick">Cancel pick</button>
          <button class="btn btn--primary btn--done" id="btn-done-arrange"><span class="ico" aria-hidden="true">✓</span> <span class="lbl">Done</span></button>
        </div>
        <div class="toolbar">
          <button class="btn btn--arrange" id="btn-arrange" aria-labelledby="arrange-label" title="Arrange your rack" aria-pressed="false"><span class="ico" aria-hidden="true">⇄</span> <span class="lbl" id="arrange-label">Arrange</span></button>
          <button class="btn btn--icon" id="btn-hand-tools" aria-label="Hand &amp; table tools" title="Sort and hand options">•••</button>
          <button class="btn btn--icon btn--glyph" id="btn-collapse" aria-label="Collapse the rack" aria-expanded="true" title="Collapse or show the rack">⌄</button>
        </div>
      </div>
      <p id="rack-hint">Pick a tile. Tap the left half of another tile for before, or its right half for after.</p>
      <div id="arrange-options" class="row arrange-options" hidden>
        <button class="btn" id="btn-group-gap">Gap before picked tile</button>
        <button class="btn" id="btn-clear-gaps">Clear gaps</button>
        <button class="btn" id="btn-to-end">To end →</button>
      </div>
      <div class="rack" id="rack"></div>
    </section>
  </div>

  <div class="ov" id="ov-dialog" hidden>
    <div class="card" id="dialog-card"></div>
  </div>

  <!-- Pass & play handover (privacy curtain) -->
  <div class="ov" id="ov-curtain" hidden>
    <div class="curtaininner">
      <div class="eyebrow">A little privacy</div>
      <h2 id="curtain-title">Pass the phone</h2>
      <p id="curtain-sub">Hand over the phone. The next rack is hidden until its owner is ready.</p>
      <button class="btn btn--primary" data-action="dismiss-curtain">I'm ready · Show my tiles</button>
    </div>
  </div>
