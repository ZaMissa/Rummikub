  <meta name="app-version" content="0.41.71">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Rummikub</h1>
    </div>
    <span class="mode-line" id="mode-line" data-i18n="mode.onThisPhone">On this phone</span>
    <div class="row row--nowrap header-actions">
      <button class="btn btn--icon" id="awayBadge" hidden data-i18n="header.updates" data-i18n-title="header.updatesTitle" title="What happened while you were away">Updates</button>
      <button class="btn btn--icon btn--nudge" id="btn-nudge" hidden data-i18n="header.nudge" data-i18n-title="header.nudgeTitle" title="Nudge the current player">Nudge</button>
      <button class="btn btn--icon btn--fullscreen" id="fullscreenBtn" data-i18n-aria="device.enterFullscreen" data-i18n-title="device.enterFullscreen" aria-label="Enter full screen" title="Enter full screen" aria-pressed="false"></button>
      <button class="btn btn--icon btn--menu" id="menuBtn" data-action="menu" data-i18n-aria="header.gameMenu" aria-label="Game menu">☰</button>
    </div>
  </header>

  <div class="banner net" id="net-banner" role="status" aria-live="polite" hidden></div>

  <div class="wrap">
    <div class="players" id="players" data-i18n-aria="hud.playersAria" aria-label="Players"></div>

    <div class="status">
      <div class="row row--between row--nowrap">
        <div class="turnline">
          <strong id="turn-title" data-i18n="hud.readyToPlay">Ready to play</strong>
          <small id="turn-sub"></small>
          <p class="hint statusline" id="status"></p>
        </div>
        <span class="pool" id="pool">106 in pool</span>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <section class="board" id="board">
      <div class="melds" id="melds"></div>
    </section>

    <section class="rackpanel" id="rackpanel">
      <!-- The in-game Hand & table drawer (v0.41.70): compact controls that slide out ABOVE the
           strip and leave the hand + felt visible, so a sort/hide/tile-size tap shows its effect
           immediately. Opened by •••; the rows are the same options the sheet renders. -->
      <div class="drawer" id="hand-drawer" data-i18n-aria="hand.title" aria-label="Hand &amp; table">
        <div class="drawer-head">
          <b data-i18n="hand.title">Hand &amp; table</b>
          <button class="btn btn--icon" id="btn-drawer-close" data-i18n-aria="common.close" aria-label="Close">×</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
      <!-- Collapse lives on the panel's border, not inside the control strip (v0.41.68). -->
      <button class="btn btn--glyph rack-handle" id="btn-collapse" data-i18n-aria="device.rackCollapse" data-i18n-title="device.rackToggleTitle" aria-label="Collapse the rack" aria-expanded="true" title="Collapse or show the rack">⌄</button>
      <!-- One control strip: [Undo] [contextual primary] + [Arrange] [more]. Placement (above or
           below the hand) is a setting; the default is above. In Arrange the strip swaps to the
           arrange actions (see syncArrangeUI). -->
      <div class="controlstrip">
        <div class="actions actions--game" id="game-actions">
          <button class="btn btn--undo" id="btn-undo" data-i18n-aria="game.undoLast" data-i18n-title="game.undoLast" aria-label="Undo last move" title="Undo last move">↶</button>
          <button class="btn btn--meld" id="btn-meld"><span class="ico" aria-hidden="true">＋</span> <span class="lbl" data-i18n="board.meld">Meld</span></button>
          <button class="btn btn--draw" id="btn-draw" data-i18n="game.draw">Draw</button>
          <button class="btn btn--primary btn--play" id="btn-play" data-i18n="game.endTurn">End turn</button>
        </div>
        <!-- A finished round has no in-game action left, so this swaps in for #game-actions
             (see syncRoundActions) and gives the table its two ways forward. -->
        <div class="actions actions--round" id="round-actions" hidden>
          <button class="btn btn--primary" id="btn-next-round" data-i18n="game.nextRound">Next round</button>
          <button class="btn" id="btn-new-game" data-i18n="common.newGame">New game</button>
        </div>
        <div class="actions actions--arrange" id="arrange-actions" hidden>
          <button class="btn btn--undo-move" id="btn-undo-move"><span class="ico" aria-hidden="true">↶</span> <span class="lbl" data-i18n="game.undoMove">Undo move</span></button>
          <button class="btn" id="btn-cancel-pick" data-i18n="game.cancelPick">Cancel pick</button>
          <button class="btn btn--primary btn--done" id="btn-done-arrange"><span class="ico" aria-hidden="true">✓</span> <span class="lbl" data-i18n="common.done">Done</span></button>
        </div>
        <div class="toolbar">
          <!-- UIU-20: shown when Single cannot hold the hand at the 26 px floor — one tap switches -->
          <button class="btn btn--chip" id="btn-rack-mode" hidden data-i18n="game.rackModeMulti" data-i18n-title="game.rackModeTitle" title="Show the hand in more lines">Multi</button>
          <button class="btn btn--icon btn--arrange" id="btn-arrange" data-i18n-aria="game.arrangeLabel" data-i18n-title="game.arrangeTitle" aria-label="Arrange your rack" title="Arrange your rack" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13m-4-4 4 4-4 4M20 15H7m4-4-4 4 4 4"/></svg></button>
          <button class="btn btn--icon" id="btn-hand-tools" data-i18n-aria="game.handTools" data-i18n-title="game.handToolsTitle" aria-label="Hand &amp; table tools" title="Sort and hand options">•••</button>
        </div>
      </div>
      <p id="rack-hint" data-i18n="rackHint.arrange">Tap another stone’s left half (before) or right half (after).</p>
      <div class="rack" id="rack"></div>
    </section>
  </div>

  <div class="ov" id="ov-dialog" hidden>
    <div class="card" id="dialog-card"></div>
  </div>

  <!-- Pass & play handover (privacy curtain) -->
  <div class="ov" id="ov-curtain" hidden>
    <div class="curtaininner">
      <div class="eyebrow" data-i18n="curtain.eyebrow">A little privacy</div>
      <h2 id="curtain-title" data-i18n="curtain.title">Pass the phone</h2>
      <p id="curtain-sub" data-i18n="curtain.sub">Hand over the phone. The next rack is hidden until its owner is ready.</p>
      <button class="btn btn--primary" data-action="dismiss-curtain" data-i18n="curtain.ready">I'm ready · Show my stones</button>
    </div>
