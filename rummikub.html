<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">13</span>
      <div class="brand-text">
        <h1>Rummikub</h1>
        <small id="mode-line">Pass &amp; Play</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="tbtn" data-action="new-game">New</button>
      <button class="tbtn" data-action="live">Live</button>
      <button class="tbtn" data-action="saves" title="Saved games">💾</button>
      <button class="tbtn" data-action="backup" title="Backup / export">📦</button>
      <button class="tbtn" data-action="activity" title="What happened">📜</button>
      <button class="tbtn" data-action="stats" title="Stats">📊</button>
      <button class="tbtn" data-action="settings" title="Settings">⚙</button>
    </div>
  </header>

  <nav class="players" id="players" aria-label="Players"></nav>
  <div class="banner" id="banner" hidden></div>

  <main class="board-wrap">
    <section class="board" aria-label="Table">
      <div class="board-head">
        <div>
          <div class="board-title">Table</div>
          <div class="board-sub" id="board-sub">Make a meld of 3+ tiles</div>
        </div>
        <div class="chips">
          <span class="chip" id="chip-mode">Standard</span>
          <span class="chip" id="chip-round">Round 1</span>
          <span class="chip" id="chip-pool">Pool 106</span>
          <span class="chip" id="chip-ice">Min 30</span>
          <span class="chip" id="chip-ver">v?</span>
        </div>
      </div>
      <div class="melds" id="melds"></div>
      <button class="lastmove" id="last-move" data-action="history" hidden></button>
    </section>
  </main>

  <div class="dock">
    <div class="dock-inner">
      <div class="dock-head">
        <div class="who"><span class="badge" id="seat-badge">Pass &amp; Play</span><b id="rack-title">Rack</b></div>
        <div class="dock-tools">
          <button class="tbtn" id="btn-undo" title="Undo last move">↩</button>
          <button class="tbtn" id="btn-arrange" title="Arrange tiles (or press and hold a tile)">⇅</button>
          <button class="tbtn" id="btn-rows" title="Rack rows">▥</button>
          <button class="tbtn" id="btn-hide" title="Hide my tiles">👁</button>
          <button class="tbtn" id="btn-nudge" title="Nudge the current player" hidden>📣</button>
          <button class="tbtn" id="btn-sort-num" title="Sort by number">123</button>
          <button class="tbtn" id="btn-sort-color" title="Sort by colour">🎨</button>
          <span class="badge" id="sel-count">0 selected</span>
        </div>
      </div>
      <div class="rack" id="rack"></div>
      <div class="rack-hint" id="rack-hint">Tap a tile to select · press and hold to arrange</div>
      <div class="actions">
        <button class="btn" id="btn-reset">Reset</button>
        <button class="btn draw" id="btn-draw">Draw</button>
        <button class="btn blue" id="btn-meld">+ Meld</button>
        <button class="btn play" id="btn-play">End Turn</button>
      </div>
    </div>
  </div>

  <!-- Curtain (pass & play handover) -->
  <div class="ov" id="ov-curtain" hidden>
    <div class="curtain">
      <div class="curtain-eye">🙈</div>
      <div class="curtain-title" id="curtain-title">Pass the phone</div>
      <div class="curtain-sub" id="curtain-sub">Tiles are hidden. Hand the device to the next player.</div>
      <button class="btn play big" data-action="dismiss-curtain">I'm ready</button>
    </div>
  </div>

  <!-- Draw reveal -->
  <div class="ov" id="ov-draw" hidden>
    <div class="curtain">
      <div class="curtain-sub">You drew</div>
      <div class="tile reveal" id="drawn-tile"><span class="n">?</span></div>
      <div class="curtain-sub" id="drawn-msg">Added to your rack</div>
      <button class="btn play big" data-action="draw-ok">Got it</button>
    </div>
  </div>

  <div class="ov" id="ov-dialog" hidden>
    <div class="card" id="dialog-card"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
